[project]
name = "lamoon-api"
version = "0.1.0"
description = "Lamoon HR — API (modular monolith)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "pyjwt>=2.10",
    "bcrypt>=4.1",
    "httpx>=0.28",
    "pymupdf>=1.24",
    "google-genai>=1.0",
    "python-multipart>=0.0.9",
    # S3-compatible object storage for payroll/compliance artifacts (ADR-0006
    # as amended). Imported lazily so dev and CI never need credentials. The
    # alternative — signing SigV4 by hand over httpx — is ~60 lines of
    # crypto-adjacent code whose failures are silent and miserable to debug.
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",  # BlobStore is async; its round-trip tests need no DB
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]  # generated-style DDL, verbose by nature

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Depends/Security in argument defaults is the FastAPI idiom, not a mutable-default bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security", "fastapi.File", "fastapi.Form", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true      # type-check inside unannotated funcs (catches real bugs)
warn_redundant_casts = true
warn_unused_ignores = true
# ponytail: pragmatic baseline, not day-one strict. `strict = true` is the goal —
# turn it on incrementally (it currently wants ~40 return annotations on routes).

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Explicit @pytest.mark.asyncio only — "auto" would try to run every async
# helper in the suite as a test.
asyncio_mode = "strict"
